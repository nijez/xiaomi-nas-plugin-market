location ~ ^/plugin/([^/]+)/communitystore/?$ {
    rewrite ^/plugin/([^/]+)/communitystore/?$ /plugin/$1/communitystore/index.html last;
}

location ~ ^/plugin/[^/]+/communitystore/(.*)$ {
    proxy_pass http://127.0.0.1:18119/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Xiaomi-Client-Verify $ssl_client_verify;
    proxy_set_header X-Xiaomi-Client-DN $ssl_client_s_dn;
    proxy_set_header X-Plugin-Proxy-Key "__PLUGIN_PROXY_KEY__";
    proxy_hide_header Server;
}
