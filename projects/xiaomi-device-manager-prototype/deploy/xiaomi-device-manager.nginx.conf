location ~ ^/plugin/[^/]+/devicemanager/api/nas-status$ {
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/plugin/[^/]+/devicemanager/?$ {
    alias /home/__NAS_USER_ID__/plugin/devicemanager/src/ui/index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

location ~ ^/plugin/(?<dm_user>[^/]+)/devicemanager/index\.html$ {
    alias /home/__NAS_USER_ID__/plugin/devicemanager/src/ui/index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Set-Cookie "xiaomi_dm_session=1; Path=/plugin/$dm_user/devicemanager/; Secure; HttpOnly; SameSite=Strict" always;
}

location ~ ^/plugin/[^/]+/devicemanager/(.*)$ {
    alias /home/__NAS_USER_ID__/plugin/devicemanager/src/ui/$1;
}
