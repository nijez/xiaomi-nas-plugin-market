<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="qb-session" content="__SESSION_TOKEN__"><meta name="csrf-token" content="__CSRF_TOKEN__"><title>qB 下载</title><link rel="stylesheet" href="styles.css?v=0.1.0-rc1"></head>
<body><div id="qb-app">
<header><div class="brand"><img data-icon="qb" alt="qBittorrent"><div><strong>qB 下载</strong><small>qBittorrent</small></div></div><button class="icon" id="refresh" title="刷新" aria-label="刷新"><img data-icon="reload" alt=""></button></header>
<main><div class="heading"><h1>下载任务</h1><span id="serviceState" role="status">正在连接</span></div>
<p id="error" role="alert" hidden></p>
<section id="setup" hidden><h2>初始化下载服务</h2><form id="setupForm"><label>下载目录<div class="field-row"><input name="path" id="downloadPath" readonly required placeholder="选择父目录"><button type="button" id="choose">选择目录</button></div></label><p class="muted">将在所选目录创建 qBDownloads，不接管已有文件夹。</p><label>管理密码<input type="password" name="password" required minlength="8" maxlength="200" autocomplete="new-password"></label><p class="muted">至少 8 位，包含大写、小写、数字、符号中的至少两种。</p><label class="check"><input type="checkbox" required>我同意启动 qBittorrent，并仅下载有权获取的内容</label><button type="submit" class="primary">安装并启动</button></form></section>
<section id="login" hidden><h2>登录 qBittorrent</h2><form id="loginForm"><label>admin 密码<input name="password" type="password" maxlength="200" autocomplete="current-password" required></label><button type="submit" class="primary">登录</button></form></section>
<div class="service-actions" id="serviceActions" hidden><span id="directory"></span><button id="toggleService">启动服务</button></div>
<section id="downloads" hidden><div class="stats"><div><small>下载速度</small><strong id="downSpeed">—</strong></div><div><small>上传速度</small><strong id="upSpeed">—</strong></div><div><small>本次已下载</small><strong id="downloaded">—</strong></div></div>
<div class="toolbar"><input id="search" type="search" placeholder="搜索任务" aria-label="搜索任务"><select id="filter" aria-label="任务状态"><option value="all">全部任务</option><option value="downloading">下载中</option><option value="completed">已完成</option><option value="stopped">已停止</option></select><button id="add" class="primary"><img data-icon="plus" alt="">添加任务</button><button id="limits">限速设置</button></div>
<p class="muted" id="count"></p><div id="tasks" class="tasks"></div><p id="empty" hidden>暂无下载任务</p><button id="logout">退出 qB 登录</button></section>
<footer>qB 下载 · 0.1.0-rc1</footer></main>
<dialog id="browse"><div class="dialog-head"><h2>选择 NAS 目录</h2><button class="icon" data-close="browse" aria-label="关闭"><img data-icon="close" alt=""></button></div><div class="field-row"><button class="icon" id="up" aria-label="上一级" title="上一级"><img data-icon="up" alt=""></button><code id="browsePath">/</code></div><div id="folders"></div><div class="dialog-actions"><button id="selectFolder" class="primary">选择此目录</button></div></dialog>
<dialog id="addDialog"><div class="dialog-head"><h2>添加下载任务</h2><button class="icon" data-close="addDialog" aria-label="关闭"><img data-icon="close" alt=""></button></div><form id="addForm"><label>磁力链接<textarea name="magnet" rows="3" placeholder="magnet:?xt=urn:btih:…"></textarea></label><label>或选择种子文件<input type="file" name="torrent" accept=".torrent,application/x-bittorrent"></label><p class="muted">保存到专用下载目录；种子文件最大 2 MiB。</p><button type="submit" class="primary">开始下载</button></form></dialog>
<dialog id="limitDialog"><div class="dialog-head"><h2>限速与并发</h2><button class="icon" data-close="limitDialog" aria-label="关闭"><img data-icon="close" alt=""></button></div><form id="limitForm"><label>下载上限（KiB/s，0 为不限速）<input name="download" type="number" min="0" max="1048576" required></label><label>上传上限（KiB/s，0 为不限速）<input name="upload" type="number" min="0" max="1048576" required></label><label>同时下载数<input name="active" type="number" min="1" max="10" required></label><button type="submit" class="primary">保存</button></form></dialog>
<dialog id="detailDialog"><div class="dialog-head"><h2 id="detailTitle">任务详情</h2><button class="icon" data-close="detailDialog" aria-label="关闭"><img data-icon="close" alt=""></button></div><p id="detailStats"></p><div id="files"></div></dialog>
<dialog id="removeDialog"><h2>移除下载任务？</h2><p>已下载文件会保留，不会删除。</p><div class="dialog-actions"><button data-close="removeDialog">取消</button><button id="confirmRemove" class="danger">移除任务</button></div></dialog>
<div id="toast" role="status" hidden></div></div><script src="app.bundle.js?v=0.1.0-rc1"></script></body></html>
