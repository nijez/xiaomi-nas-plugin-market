location = /icon/qbittorrent.icon {
    alias /data/plugin/www/icon/qbittorrent.icon;
    default_type image/png;
}
location = /qbittorrent.icon {
    alias /data/plugin/www/icon/qbittorrent.icon;
    default_type image/png;
}
location ~ ^/plugin/([^/]+)/qbittorrent/?$ {
    rewrite ^/plugin/([^/]+)/qbittorrent/?$ /plugin/$1/qbittorrent/index.html last;
}
location ~ ^/plugin/[^/]+/qbittorrent/(.*)$ {
    proxy_pass http://127.0.0.1:18122/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Xiaomi-Client-Verify $ssl_client_verify;
    proxy_set_header X-Xiaomi-Client-DN $ssl_client_s_dn;
    proxy_set_header X-Plugin-Proxy-Key "__PLUGIN_PROXY_KEY__";
    proxy_read_timeout 45s;
    client_max_body_size 3m;
    proxy_hide_header Server;
}
