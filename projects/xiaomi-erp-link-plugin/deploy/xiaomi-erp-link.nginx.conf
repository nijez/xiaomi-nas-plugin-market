location = /icon/jingsu-erp.icon {
    alias /data/plugin/www/icon/jingsu-erp.icon;
    default_type image/png;
    add_header Cache-Control "public, max-age=86400";
}

location = /jingsu-erp.icon {
    alias /data/plugin/www/icon/jingsu-erp.icon;
    default_type image/png;
    add_header Cache-Control "public, max-age=86400";
}

location ~ ^/plugin/(?<erp_user>[^/]+)/erplink(?:/.*)?$ {
    proxy_pass http://127.0.0.1:18118;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-ERP-Plugin-Base /plugin/$erp_user/erplink;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_buffering off;
    add_header Set-Cookie "xiaomi_erp_session=1; Path=/plugin/$erp_user/erplink/; Secure; HttpOnly; SameSite=Strict" always;
}
