location ~ ^/plugin/[^/]+/115sync/api/(.*)$ {
    proxy_pass http://127.0.0.1:18115/api/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/plugin/([^/]+)/115sync/?$ {
    rewrite ^/plugin/([^/]+)/115sync/?$ /plugin/$1/115sync/index.html last;
}

location ~ ^/plugin/(?<sync115_user>[^/]+)/115sync/index\.html$ {
    alias /home/__NAS_USER_ID__/plugin/115sync/src/ui/index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Set-Cookie "xiaomi_115_session=1; Path=/plugin/$sync115_user/115sync/; Secure; HttpOnly; SameSite=Strict" always;
}

location ~ ^/plugin/[^/]+/115sync/(.*)$ {
    alias /home/__NAS_USER_ID__/plugin/115sync/src/ui/$1;
}
