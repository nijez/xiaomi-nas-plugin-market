location ~ ^/plugin/[^/]+/aliyundrivesync/api/(.*)$ {
    proxy_pass http://127.0.0.1:18117/api/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Xiaomi-Client-Verify $ssl_client_verify;
    proxy_set_header X-Xiaomi-Client-DN $ssl_client_s_dn;
    proxy_set_header X-Plugin-Proxy-Key "__PLUGIN_PROXY_KEY__";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/plugin/([^/]+)/aliyundrivesync/?$ {
    rewrite ^/plugin/([^/]+)/aliyundrivesync/?$ /plugin/$1/aliyundrivesync/index.html last;
}

location ~ ^/plugin/(?<aliyun_user>[^/]+)/aliyundrivesync/index\.html$ {
    alias /home/__NAS_USER_ID__/plugin/aliyundrivesync/src/ui/index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

location ~ ^/plugin/[^/]+/aliyundrivesync/(.*)$ {
    alias /home/__NAS_USER_ID__/plugin/aliyundrivesync/src/ui/$1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}
